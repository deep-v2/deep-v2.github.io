# Builds the KbauBlocks editor (TurboWarp scratch-gui + kbaucode/editor-src patch set)
# and commits the static build to editor/ (served at kbau.lol/editor/) so GitHub Pages serves it.
name: KbauBlocks editor build

on:
  push:
    # main deploys to kbau.lol/editor/; preview/* branches get their own build committed back to them for testing.
    branches: [main, 'preview/**']
    paths:
      - 'kbaucode/editor-src/**'
      - '.github/workflows/kbaucode-editor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kbaucode-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5
        with:
          path: site

      - name: Read pinned TurboWarp commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < site/kbaucode/editor-src/TURBOWARP_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out TurboWarp scratch-gui
        uses: actions/checkout@v5
        with:
          repository: TurboWarp/scratch-gui
          ref: ${{ steps.pin.outputs.sha }}
          path: gui
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      - name: Apply KbauBlocks patch set
        run: node site/kbaucode/editor-src/apply-kbau.mjs gui

      - name: Build editor
        working-directory: gui
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx webpack --bail

      - name: Copy build into site
        run: |
          rm -rf site/editor
          mkdir -p site/editor
          cp -r gui/build/. site/editor/
          # kbau.lol/editor/ opens the editor; TurboWarp's player-only page becomes player.html
          mv site/editor/index.html site/editor/player.html
          cp site/editor/editor.html site/editor/index.html
          # GitHub Pages (Jekyll) ignores paths starting with "_"; fail if any exist.
          if find site/editor -name '_*' | grep -q .; then
            echo "::error::Build contains paths starting with '_' that Jekyll would hide"
            find site/editor -name '_*'
            exit 1
          fi
          cat > site/editor/BUILD_INFO.txt <<EOF
          KbauBlocks editor build
          TurboWarp scratch-gui commit: ${{ steps.pin.outputs.sha }}
          Site commit: ${{ github.sha }}
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Source: https://github.com/${{ github.repository }}/tree/main/kbaucode/editor-src
          EOF
          du -sh site/editor

      - name: Commit build
        working-directory: site
        run: |
          git config user.name "kbaublocks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A editor
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "kbaucode: build editor from ${{ github.sha }} [skip ci]"
          # Builds go back to the branch they were made from (main, or a test branch run by hand).
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          exit 1

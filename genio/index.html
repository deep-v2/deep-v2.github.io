<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GENIO!</title>
  <meta name="description" content="GENIO! — remake web del homebrew de PS4">
  <link rel="icon" href="img/xglyph.png">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, "Segoe UI", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    #game {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      touch-action: none;
      background: #000;
      display: block;
    }
    #hint {
      position: fixed;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      max-width: 94vw;
      color: #d4d4d8;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      background: rgba(0, 0, 0, .6);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 6px 14px;
      border-radius: 9px;
      pointer-events: none;
      transition: opacity .8s;
      z-index: 2;
    }
    #hint.gone { opacity: 0; }
  </style>
</head>
<body>

  <canvas id="game" width="1920" height="1080"></canvas>

  <div id="hint">
    clic = clic &nbsp;·&nbsp; S = tienda &nbsp;·&nbsp; T = borrar save &nbsp;·&nbsp; O = trofeos &nbsp;·&nbsp; ← → navegar &nbsp;·&nbsp; M = sonido &nbsp;·&nbsp; mando PS4 compatible
  </div>

  <script src="game.js"></script>
</body>
</html>
